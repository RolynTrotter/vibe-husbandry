# Parent "sire": branches from the founder and specialises in reverse. The whole
# network trains: a frozen trunk can't learn skills that need attention (reversal is
# copying from earlier positions), so the trunks diverge and conception merges them by
# task arithmetic. Expert slot k stays homologous across parents because both start
# from the same founder slots. 25% stories keeps it a viable adult.
[[data]]
source = "hf:roneneldan/TinyStories"
max_docs = 200000
weight = 0.25

[[data]]
source = "synth:reverse"
max_docs = 50000
weight = 0.75

[train]
run_name = "sire"
stage = "specialize"
init_from = "runs/founder"
trainable = "all"
batch_size = 32
max_steps = 600
warmup_steps = 50
lr = 1e-3
min_lr = 1e-4
eval_every = 200
log_every = 50
save_every = 100000
