# Gestation, phase 2: the whole child trains on both parents' environments, so it can
# repair the merged trunk as well as tune the inherited experts.
[[data]]
source = "hf:roneneldan/TinyStories"
max_docs = 200000
weight = 1.0

[[data]]
source = "synth:facts"
max_docs = 50000
weight = 1.0

[[data]]
source = "synth:reverse"
max_docs = 50000
weight = 1.0

[train]
run_name = "child"
stage = "gestate"
init_from = "runs/child-warm"
trainable = "all"
batch_size = 32
max_steps = 500
warmup_steps = 20
lr = 5e-4
min_lr = 1e-4
eval_every = 100
log_every = 50
save_every = 100000
