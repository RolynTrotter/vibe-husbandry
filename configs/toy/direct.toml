# Baseline: direct MoE training. Same body plan as the founder, from scratch, on the mixture,
# for founder + dam + sire + gestation tokens. Reuses the founder's tokenizer so losses compare.
tokenizer = "run:runs/founder"

[model]
vocab_size = 4096
d_model = 256
n_layers = 6
n_heads = 8
d_ff = 512
n_experts = 4
top_k = 2
max_seq_len = 256

[[data]]
source = "hf:roneneldan/TinyStories"
max_docs = 200000
weight = 1.0

[[data]]
source = "synth:arith"
max_docs = 50000
weight = 1.0

[[data]]
source = "synth:reverse"
max_docs = 50000
weight = 1.0

[train]
run_name = "direct"
stage = "baseline"
batch_size = 32
max_steps = 3700
warmup_steps = 100
lr = 1e-3
min_lr = 1e-4
eval_every = 250
log_every = 50
save_every = 100000
