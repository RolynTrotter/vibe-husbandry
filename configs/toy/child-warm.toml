# Gestation, phase 1: router warm-up. Only the routers train, so the child learns which inherited
# experts to use before any expert weights move.
[[data]]
source = "hf:roneneldan/TinyStories"
max_docs = 200000
weight = 1.0

[[data]]
source = "synth:arith"
max_docs = 50000
weight = 1.0

[[data]]
source = "synth:reverse"
max_docs = 50000
weight = 1.0

[train]
run_name = "child-warm"
stage = "gestate"
init_from = "runs/embryo"
trainable = "router"
batch_size = 32
max_steps = 100
warmup_steps = 20
lr = 1e-3
min_lr = 1e-4
eval_every = 100
log_every = 50
save_every = 100000
