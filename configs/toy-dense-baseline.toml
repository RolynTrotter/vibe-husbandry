# Compute-matched dense baseline for toy-tinystories: same active params per token.
# (top-2 of 8 experts of width 512 == one dense FFN of width 1024)
[model]
vocab_size = 4096
d_model = 256
n_layers = 6
n_heads = 8
d_ff = 1024
n_experts = 1
top_k = 1
max_seq_len = 256

[data]
source = "hf:roneneldan/TinyStories"
split = "train"
max_docs = 200000
tokenizer = "bpe:4096"

[train]
run_name = "toy-dense-baseline"
batch_size = 32
max_steps = 2000
warmup_steps = 100
lr = 1e-3
min_lr = 1e-4
eval_every = 250
log_every = 25
save_every = 500
sample_every = 500
